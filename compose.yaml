services:
  wildseed:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      WILDSEED_TOKEN: ${WILDSEED_TOKEN:?Set WILDSEED_TOKEN before starting}
      WILDSEED_VIEW_TOKEN: ${WILDSEED_VIEW_TOKEN:-}
    volumes:
      - world-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  world-data:
